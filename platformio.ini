; Talkie-walkie LoRa vocal : ESP32-S3 + SX1276 + INMP441 + MAX98357A
[platformio]
default_envs = talkie_a

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; PSRAM octale (modules N8R8 / N16R8). Pour un module N8R2 : qio_qspi
board_build.arduino.memory_type = qio_opi
; Module 16 Mo (N16R8) : décommenter les 2 lignes suivantes
; board_upload.flash_size = 16MB
; board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    jgromes/RadioLib@^6.6.0
    https://github.com/pschatzmann/arduino-libcodec2.git

; Appareil A (identifiant 1)
[env:talkie_a]
build_flags = ${env.build_flags} -DDEVICE_ID=1

; Appareil B (identifiant 2)
[env:talkie_b]
build_flags = ${env.build_flags} -DDEVICE_ID=2

; Test audio sans radio : enregistre pendant l'appui sur PTT, rejoue au relâchement
[env:loopback]
build_flags = ${env.build_flags} -DDEVICE_ID=1 -DLOOPBACK_TEST

; ---- Variantes avec filtre anti-bruit ESP-SR (NSNet) ----
; Elles utilisent pioarduino (Arduino-ESP32 3.x) et la table de partitions avec « model ».
; Voir README, section « Filtre anti-bruit ESP-SR ».
[env:talkie_a_ns]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = partitions_sr.csv
build_flags = ${env.build_flags} -DDEVICE_ID=1

[env:talkie_b_ns]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = partitions_sr.csv
build_flags = ${env.build_flags} -DDEVICE_ID=2
